[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groww-ai-trading-agent"
version = "0.1.0"
description = "Paper-trading AI agent for Indian equities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
groww-agent = "groww_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
